<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>three.rb instanced mesh sync benchmark</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101418;
        color: #eef3f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: minmax(320px, 1fr) auto;
        overflow: hidden;
      }

      .viewport {
        position: relative;
        min-width: 320px;
        min-height: 320px;
        background: #101418;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(10, 14, 18, 0.76);
        color: #dce7ef;
        font-size: 13px;
        line-height: 1.3;
        backdrop-filter: blur(10px);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #f2b84b;
        box-shadow: 0 0 14px rgba(242, 184, 75, 0.72);
      }

      .status-dot[data-state="running"] {
        background: #4ed08f;
        box-shadow: 0 0 14px rgba(78, 208, 143, 0.72);
      }

      .status-dot[data-state="error"] {
        background: #f15b5b;
        box-shadow: 0 0 14px rgba(241, 91, 91, 0.72);
      }

      .results {
        max-height: 36vh;
        margin: 0;
        overflow: auto;
        padding: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        background: #151a1f;
        color: #cfe2ef;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@bjorn3/browser_wasi_shim": "/node_modules/@bjorn3/browser_wasi_shim/dist/index.js",
          "@ruby/wasm-wasi/browser": "/node_modules/@ruby/wasm-wasi/dist/esm/browser.js",
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      const status = document.querySelector("#status");
      const statusDot = document.querySelector("#status-dot");

      globalThis.__threeRbSetStatus = (message, state) => {
        if (status) status.textContent = message;
        if (statusDot) statusDot.dataset.state = state;
      };

      globalThis.__threeRbBootFailed = (message) => {
        globalThis.__threeRbSetStatus(message, "error");
      };

      globalThis.addEventListener("error", (event) => {
        globalThis.__threeRbBootFailed(event.message || "Browser error");
      });

      globalThis.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        globalThis.__threeRbBootFailed(reason && reason.message ? reason.message : "Ruby boot failed");
      });

      globalThis.__threeRbSetStatus("Loading ruby.wasm", "loading");
    </script>
    <script type="module" src="./boot.mjs"></script>
  </head>
  <body>
    <main class="viewport" id="viewport">
      <canvas id="scene" data-testid="scene-canvas"></canvas>
      <div class="hud" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span id="status" data-testid="status">Loading ruby.wasm</span>
      </div>
    </main>
    <pre class="results" id="result" data-testid="result">Waiting for benchmark...</pre>
  </body>
</html>
