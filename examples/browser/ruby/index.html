<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>three-rb ruby</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8fbff;
        color: #243142;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: stretch;
        overflow: hidden;
      }

      .viewport {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 320px;
        min-height: 320px;
        background:
          linear-gradient(rgba(104, 143, 168, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(104, 143, 168, 0.045) 1px, transparent 1px),
          linear-gradient(155deg, #ffffff 0%, #f8fdff 44%, #fff9fb 74%, #f5fbf2 100%);
        background-size: 36px 36px, 36px 36px, auto;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        min-width: min(360px, calc(100% - 32px));
        padding: 8px 10px;
        border: 1px solid rgba(84, 105, 130, 0.18);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 14px 34px rgba(53, 72, 94, 0.16);
        color: #243142;
        font-size: 13px;
        line-height: 1.3;
        backdrop-filter: blur(10px);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #f0b83e;
        box-shadow: 0 0 14px rgba(240, 184, 62, 0.72);
      }

      .status-dot[data-state="running"] {
        background: #2fae66;
        box-shadow: 0 0 14px rgba(47, 174, 102, 0.72);
      }

      .status-dot[data-state="error"] {
        background: #d64040;
        box-shadow: 0 0 14px rgba(214, 64, 64, 0.72);
      }

      .status-dot[data-state="loading"] {
        animation: status-dot-pulse 1.2s ease-in-out infinite;
      }

      @keyframes status-dot-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.4;
          transform: scale(0.75);
        }
      }

      .progress {
        grid-column: 1 / -1;
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(84, 105, 130, 0.16);
      }

      .progress-bar {
        width: 4%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #55ace0, #2fae66);
        transition: width 180ms ease;
      }

      .progress[hidden] {
        display: none;
      }

      .repo-link {
        position: absolute;
        top: 16px;
        right: 16px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 8px 10px;
        border: 1px solid rgba(84, 105, 130, 0.18);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 14px 34px rgba(53, 72, 94, 0.16);
        color: #243142;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        backdrop-filter: blur(10px);
      }

      .repo-link:hover,
      .repo-link:focus-visible {
        border-color: rgba(207, 23, 72, 0.38);
        color: #cf1748;
        outline: none;
      }

      .repo-link svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      @media (max-width: 560px) {
        .repo-link {
          top: auto;
          right: 16px;
          bottom: 16px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@bjorn3/browser_wasi_shim": "/node_modules/@bjorn3/browser_wasi_shim/dist/index.js",
          "@ruby/wasm-wasi/browser": "/node_modules/@ruby/wasm-wasi/dist/esm/browser.js",
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      const status = document.querySelector("#status");
      const statusDot = document.querySelector("#status-dot");
      const progress = document.querySelector("#progress");
      const progressBar = document.querySelector("#progress-bar");

      globalThis.__threeRbSetStatus = (message, state, percent) => {
        if (status) status.textContent = message;
        if (statusDot) statusDot.dataset.state = state;
        if (progress && progressBar) {
          if (state === "running" || state === "error") {
            progress.hidden = true;
          } else {
            progress.hidden = false;
            if (Number.isFinite(percent)) {
              progressBar.style.width = `${Math.max(4, Math.min(100, percent))}%`;
            }
          }
        }
      };

      globalThis.__threeRbBootFailed = (message) => {
        globalThis.__threeRbSetStatus(message, "error");
      };

      globalThis.addEventListener("error", (event) => {
        globalThis.__threeRbBootFailed(event.message || "Browser error");
      });

      globalThis.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        globalThis.__threeRbBootFailed(reason && reason.message ? reason.message : "Ruby boot failed");
      });

      globalThis.setTimeout(() => {
        if (status && statusDot && statusDot.dataset.state === "loading") {
          status.textContent = "Still loading after 15 seconds. Try reloading the page.";
        }
      }, 15000);

      globalThis.__threeRbSetStatus("Loading ruby.wasm", "loading", 4);
    </script>
    <script type="module" src="./boot.mjs"></script>
  </head>
  <body>
    <main class="viewport" id="viewport">
      <canvas id="scene" data-testid="scene-canvas"></canvas>
      <div class="hud" aria-live="polite">
        <span class="status-dot" id="status-dot" data-state="loading"></span>
        <span id="status" data-testid="status">Loading ruby.wasm</span>
        <div class="progress" id="progress" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
      <a class="repo-link" href="https://github.com/lef237/three.rb" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub repository">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.67 0 8.2c0 3.62 2.29 6.69 5.47 7.78.4.08.55-.18.55-.4 0-.2-.01-.85-.01-1.54-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.98-.82-1.18-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.51-1.09-1.78-.21-3.64-.91-3.64-4.04 0-.89.31-1.63.82-2.2-.08-.21-.36-1.04.08-2.17 0 0 .67-.22 2.2.84A7.43 7.43 0 0 1 8 3.94c.68 0 1.36.09 2 .28 1.53-1.06 2.2-.84 2.2-.84.44 1.13.16 1.96.08 2.17.51.57.82 1.3.82 2.2 0 3.14-1.87 3.83-3.65 4.04.29.26.54.75.54 1.52 0 1.09-.01 1.97-.01 2.24 0 .22.15.48.55.4A8.17 8.17 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"></path>
        </svg>
        GitHub
      </a>
    </main>
  </body>
</html>
