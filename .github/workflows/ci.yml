name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install browser dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level moderate

      - name: Verify JavaScript registry signatures
        run: pnpm audit signatures

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Ruby tests
        run: bundle exec rake test

      - name: Run gem install smoke test
        run: bundle exec rake release:gem_smoke

      - name: Run browser smoke test
        run: pnpm test:browser

  ruby-versions:
    # The job above covers Ruby 3.4 along with the browser tests. The browser
    # runs Ruby 3.4 through ruby.wasm whatever the host Ruby is, so the other
    # supported versions only need the Ruby tests and the gem install check.
    name: Ruby ${{ matrix.ruby }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run Ruby tests
        run: bundle exec rake test

      - name: Run gem install smoke test
        run: bundle exec rake release:gem_smoke
