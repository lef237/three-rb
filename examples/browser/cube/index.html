<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>three.rb cube</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101418;
        color: #eef3f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: stretch;
        overflow: hidden;
      }

      .viewport {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 320px;
        min-height: 320px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(135deg, #101418 0%, #172026 52%, #0f1215 100%);
        background-size: 32px 32px, 32px 32px, auto;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(10, 14, 18, 0.72);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
        color: #dce7ef;
        font-size: 13px;
        line-height: 1.3;
        backdrop-filter: blur(10px);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #f2b84b;
        box-shadow: 0 0 14px rgba(242, 184, 75, 0.72);
      }

      .status-dot[data-state="running"] {
        background: #4ed08f;
        box-shadow: 0 0 14px rgba(78, 208, 143, 0.72);
      }

      .status-dot[data-state="error"] {
        background: #f15b5b;
        box-shadow: 0 0 14px rgba(241, 91, 91, 0.72);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      globalThis.__threeReady = import("three").then((module) => {
        globalThis.THREE = module;
        return module;
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@ruby/3.4-wasm-wasi@2.9.4/dist/browser.script.iife.js"></script>
    <script type="text/ruby" data-eval="async">
      require "js/require_remote/relative_shim"
      require_relative "main"
    </script>
  </head>
  <body>
    <main class="viewport" id="viewport">
      <canvas id="scene"></canvas>
      <div class="hud" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span id="status">Loading ruby.wasm</span>
      </div>
    </main>
  </body>
</html>
