<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>three-rb dango</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #faf5ec;
        color: #263126;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: stretch;
        overflow: hidden;
      }

      .viewport {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 320px;
        min-height: 320px;
        background:
          linear-gradient(rgba(150, 122, 82, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(150, 122, 82, 0.045) 1px, transparent 1px),
          linear-gradient(135deg, #fff9f1 0%, #f3f6e5 48%, #f4eadb 100%);
        background-size: 34px 34px, 34px 34px, auto;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        min-width: min(360px, calc(100% - 32px));
        padding: 8px 10px;
        border: 1px solid rgba(38, 49, 38, 0.12);
        border-radius: 6px;
        background: rgba(255, 252, 245, 0.82);
        box-shadow: 0 12px 30px rgba(83, 64, 39, 0.18);
        color: #263126;
        font-size: 13px;
        line-height: 1.3;
        backdrop-filter: blur(10px);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #c08d3d;
        box-shadow: 0 0 14px rgba(192, 141, 61, 0.72);
      }

      .status-dot[data-state="running"] {
        background: #6fa35c;
        box-shadow: 0 0 14px rgba(111, 163, 92, 0.72);
      }

      .status-dot[data-state="error"] {
        background: #cf554d;
        box-shadow: 0 0 14px rgba(207, 85, 77, 0.72);
      }

      .status-dot[data-state="loading"] {
        animation: status-dot-pulse 1.2s ease-in-out infinite;
      }

      @keyframes status-dot-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.4;
          transform: scale(0.75);
        }
      }

      .progress {
        grid-column: 1 / -1;
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(38, 49, 38, 0.14);
      }

      .progress-bar {
        width: 4%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #55ace0, #6fa35c);
        transition: width 180ms ease;
      }

      .progress[hidden] {
        display: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@bjorn3/browser_wasi_shim": "/node_modules/@bjorn3/browser_wasi_shim/dist/index.js",
          "@ruby/wasm-wasi/browser": "/node_modules/@ruby/wasm-wasi/dist/esm/browser.js",
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      const status = document.querySelector("#status");
      const statusDot = document.querySelector("#status-dot");
      const progress = document.querySelector("#progress");
      const progressBar = document.querySelector("#progress-bar");

      globalThis.__threeRbSetStatus = (message, state, percent) => {
        if (status) status.textContent = message;
        if (statusDot) statusDot.dataset.state = state;
        if (progress && progressBar) {
          if (state === "running" || state === "error") {
            progress.hidden = true;
          } else {
            progress.hidden = false;
            if (Number.isFinite(percent)) {
              progressBar.style.width = `${Math.max(4, Math.min(100, percent))}%`;
            }
          }
        }
      };

      globalThis.__threeRbBootFailed = (message) => {
        globalThis.__threeRbSetStatus(message, "error");
      };

      globalThis.addEventListener("error", (event) => {
        globalThis.__threeRbBootFailed(event.message || "Browser error");
      });

      globalThis.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        globalThis.__threeRbBootFailed(reason && reason.message ? reason.message : "Ruby boot failed");
      });

      globalThis.setTimeout(() => {
        if (status && statusDot && statusDot.dataset.state === "loading") {
          status.textContent = "Still loading after 30 seconds. Try reloading the page.";
        }
      }, 30000);

      globalThis.__threeRbSetStatus("Loading ruby.wasm", "loading", 4);
    </script>
    <script type="module" src="./boot.mjs"></script>
  </head>
  <body>
    <main class="viewport" id="viewport">
      <canvas id="scene" data-testid="scene-canvas"></canvas>
      <div class="hud" aria-live="polite">
        <span class="status-dot" id="status-dot" data-state="loading"></span>
        <span id="status" data-testid="status">Loading ruby.wasm</span>
        <div class="progress" id="progress" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </main>
  </body>
</html>
